                          example: true
                          default: true
                        code:
                          type: integer
                          example: 200
                          default: 0
                        message:
                          type: string
                          example: Reward issued successfully
                    rewards:
                      type: array
                      items:
                        type: object
                        properties:
                          status:
                            type: object
                            properties:
                              success:
                                type: boolean
                                example: true
                                default: true
                              code:
                                type: integer
                                example: 200
                                default: 0
                              message:
                                type: string
                                example: Reward issued successfully
                          orgId:
                            type: integer
                            example: 4000086
                            default: 0
                          transactionId:
                            type: integer
                            example: 57097
                            default: 0
                          rewardId:
                            type: integer
                            example: 350
                            default: 0
                          requestedQuantity:
                            type: integer
