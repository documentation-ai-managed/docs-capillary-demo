                                example: 1
                                default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                '8003':
                  value:
                    status:
                      success: false
                      code: 8003
                      message: fail to issue reward
                    rewards:
                    - status:
                        success: false
                        code: 12005
                        message: Reward constraint evaluation failed. Request failed. Max limit for the
                          DAYS is reached. Allowed limit is 15 For Level CUSTOMER
                      rewardId: 49827
                      requestedQuantity: 1
                      pointsReferenceId: null
                      intouch: null
                      promotions: null
                      vendor: null
                      restrictions: null
                Result:
                  value:
                    status:
                      success: false
                      code: 8010
                      message: Reward issued partially
                    rewards:
                    - status:
                        success: true
                        code: 200
                        message: Reward issued successfully
                      rewardId: 13
                      requestedQuantity: 1
                      pointsReferenceId: ZGxGVD
                      intouch:
                      - pointsRedeemed: '50'
                        couponCode: 42FU1ZP3
                        codeExpiry: '2023-06-09 00:00:00'
                      promotions: []
                      vendor: []
                      restrictions: null
                    - status:
                        success: false
                        code: 8004
                        message: fail to issue reward as  Coupon has expired
                      rewardId: 12
                      requestedQuantity: 1
                      pointsReferenceId: ZGxGVD
                      intouch: null
                      promotions: []
                      vendor: []
                      restrictions: null
              schema:
                oneOf:
                - type: object
                  properties:
                    status:
                      type: object
                      properties:
                        success:
                          type: boolean
                          example: false
                          default: true
                        code:
