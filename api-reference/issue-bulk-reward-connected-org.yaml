                            default: 0
                          transactionId:
                            type: integer
                            example: 57097
                            default: 0
                          rewardId:
                            type: integer
                            example: 350
                            default: 0
                          requestedQuantity:
                            type: integer
                            example: 1
                            default: 0
                          quantity:
                            type: integer
                            example: 1
                            default: 0
                          pointsReferenceId:
                            type: string
                            example: 7Scaq1
                          pointsReferenceIds:
                            type: array
                            items:
                              type: string
                              example: 7Scaq1
                          eventLogId: {}
                          requestId: {}
                          intouch: {}
                          promotions:
