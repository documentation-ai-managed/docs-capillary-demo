openapi: 3.1.0
info:
  title: Issue Reward in connected orgs
  version: '1.0'
servers:
- url: https://{host}
  variables:
    host:
      default: host
security:
- sec0: []
paths:
  /v1.1/user/rewards/issue/:
    post:
      summary: Issue Reward in connected orgs
      description: ''
      operationId: issue-bulk-reward-connected-org
      parameters:
      - name: username
        in: query
        description: username here represents name of the store
        required: true
        schema:
          type: string
          default: store_name
      - name: skip_validation
        in: query
        description: optional
        schema:
          type: string
      - name: till
        in: query
        schema:
          type: string
        required: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mobile:
                  type: string
                  description: Mobile number/ email Id/ External Id of the customer
                brand:
                  type: string
                  description: name of the brand
                transactionNumber:
                  type: string
                  description: transaction number for issuing the reward
                rewardId:
                  type: string
                  description: reward ID(s) of the rewards to be issued
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                With DATA-SCOPE as SELF:
                  value:
                    status:
                      success: true
                      code: 200
                      message: Reward issued successfully
                    rewards:
                    - status:
                        success: true
                        code: 200
                        message: Reward issued successfully
                      orgId: 4004543
                      transactionId: 57097
                      rewardId: 350
                      requestedQuantity: 1
                      quantity: 1
                      pointsReferenceId: 7Scaq1
                      pointsReferenceIds:
                      - 7Scaq1
                      eventLogId: null
                      requestId: null
                      intouch: null
                      promotions: []
                      vendor:
                      - valid_till: '2027-11-01'
                        voucher: OV4GJYQV3Y
                        pointsRedeemed: '2'
                        offer_name: marvel-loadtest
                        coupon_series_id: '234'
                      restrictions: null
                      paymentConfig:
                        paymentMode: CONV_RATIO
                        id: 54
                        conversionRatio: 0.5
                      fulfillmentDetails: null
                      customFields: null
                      redemptionDetails:
                        redemptionType: MILES
                        totalRedemptionValue: 1
                With DATA-SCOPE as OTHER:
                  value:
                    status:
                      success: true
                      code: 200
                      message: Reward issued successfully
                    rewards:
                    - status:
                        success: true
                        code: 200
                        message: Reward issued successfully
                      orgId: 4000086
                      transactionId: 57097
                      rewardId: 350
                      requestedQuantity: 1
                      quantity: 1
                      pointsReferenceId: 7Scaq1
                      pointsReferenceIds:
                      - 7Scaq1
                      eventLogId: null
                      requestId: null
                      intouch: null
                      promotions: []
                      vendor:
                      - valid_till: '2027-11-01'
                        voucher: OV4GJYQV3Y
                        pointsRedeemed: '2'
                        offer_name: marvel-loadtest
                        coupon_series_id: '234'
                      restrictions: null
                      paymentConfig:
                        paymentMode: CONV_RATIO
                        id: 54
                        conversionRatio: 0.5
                      fulfillmentDetails: null
                      customFields: null
                      redemptionDetails:
                        redemptionType: MILES
                        totalRedemptionValue: 1
              schema:
                oneOf:
                - title: With DATA-SCOPE as SELF
                  type: object
                  properties:
                    status:
                      type: object
                      properties:
                        success:
                          type: boolean
                          example: true
                          default: true
                        code:
                          type: integer
                          example: 200
                          default: 0
                        message:
                          type: string
                          example: Reward issued successfully
                    rewards:
                      type: array
                      items:
                        type: object
                        properties:
                          status:
                            type: object
                            properties:
                              success:
                                type: boolean
                                example: true
                                default: true
                              code:
