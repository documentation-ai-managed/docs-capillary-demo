openapi: 3.1.0
info:
  title: Get top ranked users
  version: '1.0'
servers:
- url: https://{host}
  variables:
    host:
      default: host
security:
- sec0: []
paths:
  /api_gateway/intouch-api-v3/v3.1/leaderboards/targetGroups/{targetGroupId}:
    get:
      summary: Get top ranked users
      description: ''
      operationId: get-top-ranked-users
      parameters:
      - name: targetId
        in: query
        description: The ID of the target. A target is a set of conditions or rules that need to be met
          to achieve a specific goal.
        required: true
        schema:
          type: integer
          format: int64
      - name: periodId
        in: query
        description: The period ID of the target. A period is a set of parameters that define the timeframe
          for a target.  If periodId is not provided, the current period of the target group will be used.
        schema:
          type: integer
          format: int64
      - name: pageSize
        in: query
        description: The number of results required.  For example, to view the top five ranks only, set
          the value to 5.
        schema:
          type: integer
          format: int32
      - name: pageOffset
        in: query
        description: The start page from which data retrieval starts. This value should not be negative.  For
          example, a value of 5 indicates that data retrieval will begin from the 5th page.
        schema:
          type: integer
          format: int32
      - name: pageLimit
        in: query
        description: Number of pages from which results are displayed.    A maximum of 100 pages can be
          viewed in one request.
        schema:
          type: integer
          format: int32
      - name: DATA-SCOPE-ORG
        in: header
        description: List of Organisation IDs
        schema:
          type: string
      - name: DATA-SCOPE
        in: header
        description: 'Scopes define what data can be accessed using the API. You can use scopes to control
          access to data from a parent or child organisation. Defining a scope ensures that the response
          contains only data from the respective organisation.  Supported headers: SELF, OTHER and ALL.'
        schema:
          type: string
      - in: path
        name: targetGroupId
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
