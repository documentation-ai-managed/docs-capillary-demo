        description: Module for which the reward was created.
        schema:
          type: string
          enum:
          - Loyalty program
          - Milestones
          - Campaigns
          - Journeys
          - Goodwill.
      - name: ownerId
        in: query
        description: Unique identifier of the owner to claim the reward.
        schema:
          type: string
      - name: size
        in: query
        description: Results to show per page. Default - 100
        schema:
          type: string
      - name: page
        in: query
        description: Allows to retrieve details of a specific page.
        schema:
          type: string
      - name: language
        in: query
        description: Filters the response based on the reward language. Use this parameter to retrieve
          rewards in a specific language. For example, to display rewards in English, set the parameter
          to en
        schema:
          type: string
          enum:
          - ''
          default: en
      - name: brandID
        in: path
        required: true
        schema:
          type: string
