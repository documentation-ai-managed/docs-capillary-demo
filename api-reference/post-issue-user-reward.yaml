openapi: 3.1.0
info:
  title: Issue single reward
  version: '1.0'
servers:
- url: https://{host}
  variables:
    host:
      default: host
security:
- sec0: []
paths:
  /api_gateway/rewards/core/v1/user/reward/{rewardId}/issue:
    post:
      summary: Issue single reward
      description: ''
      operationId: post-issue-user-reward
      parameters:
      - name: rewardId
        in: path
        description: Unique identifier of the reward.
        schema:
          type: string
        required: true
      - name: skip_validation
        in: query
        schema:
          type: string
      - name: username
        in: query
        description: Username here represents name of the store.
        required: true
        schema:
          type: string
      - name: store
        in: query
        schema:
          type: string
        required: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - mobile
              - brand
              - transactionNumber
              properties:
                mobile:
                  type: string
                  description: Mobile number, email ID, or external ID of the customer
                brand:
                  type: string
                  description: name of the brand
                transactionNumber:
                  type: string
                  description: transaction number for issuing the reward
                notes:
                  type: string
                  description: custom metadata for the reward
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    status:
                      success: true
                      code: 200
                      message: Reward issued successfully
                    intouch: null
                    transactionId: 397137
                    promotion: null
                    vendor:
                      pointsRedeemed: '500'
                    paymentConfig: null
                    redemptionDetails: null
                    fulfillmentDetails: null
                    customFields: null
                    eventLogId: null
                    requestId: null
                    eventDateTime: '2025-03-27T13:38:11Z'
              schema:
                type: object
                properties:
                  status:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                        default: true
                      code:
                        type: integer
                        example: 200
                        default: 0
                      message:
                        type: string
                        example: Reward issued successfully
                  intouch: {}
                  transactionId:
                    type: integer
                    example: 397137
                    default: 0
                  promotion: {}
                  vendor:
                    type: object
                    properties:
                      pointsRedeemed:
                        type: string
                        example: '500'
                  paymentConfig: {}
                  redemptionDetails: {}
                  fulfillmentDetails: {}
                  customFields: {}
                  eventLogId: {}
                  requestId: {}
                  eventDateTime:
                    type: string
                    example: '2025-03-27T13:38:11Z'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                '3004':
                  value:
                    status:
                      success: false
                      code: 3004
                      message: Brand not found
                '8003':
                  value:
                    status:
                      success: false
                      code: 8003
                      message: fail to issue reward as Reward is disabled or not started yet or expired
                    rewards: null
                '8004':
                  value:
                    status:
                      success: false
                      code: 8004
                      message: fail to issue reward as  points are not redeemable
                    intouch: null
                    promotion: null
                    vendor: null
                '8010':
                  value:
                    status:
                      success: false
                      code: 8010
                      message: Reward issued partially
                    rewards:
                    - status:
                        success: true
                        code: 200
                        message: Reward issued successfully
                      rewardId: 13649
                      requestedQuantity: 1
                      pointsReferenceId: jDgoKj
                      intouch: null
                      promotions: []
                      vendor:
                      - voucher: '1510791'
                        pointsRedeemed: '114'
                      restrictions: null
                      paymentConfig:
                        paymentMode: CONV_RATIO
                        id: 307
                        conversionRatio: 0.35
                      fulfillmentDetails: null
                      customFields: null
                    - status:
                        success: false
                        code: 12035
                        message: Payment Mode needs to be passed when multiple payment Payment Config
                          Exists
                      rewardId: 14746
                      requestedQuantity: 1
                      pointsReferenceId: null
                      intouch: null
                      promotions: null
                      vendor: null
                      restrictions: null
                      paymentConfig: null
                      fulfillmentDetails: null
                      customFields: null
                '12005':
                  value:
                    status:
                      success: false
                      code: 12005
                      message: Reward constraint evaluation failed. Request failed. Max limit for the
                        DAYS is reached. Allowed limit is 15 For Level CUSTOMER
                    intouch: null
                    promotion: null
                    vendor: null
                '12016':
                  value:
                    status:
                      success: false
                      code: 12016
                      message: Invalid payment mode passed.
                    intouch: null
                    promotion: null
                    vendor: null
                    paymentConfig: null
                    fulfillmentDetails: null
                    customFields: null
                Result:
                  value:
                    status:
                      success: false
                      code: 400
                      message: Invalid payment mode passed.,Payment configuration id is mandatory
              schema:
                oneOf:
                - title: '8003'
                  type: object
                  properties:
                    status:
                      type: object
