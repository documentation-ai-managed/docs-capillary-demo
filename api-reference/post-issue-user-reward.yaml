                      properties:
                        success:
                          type: boolean
                          example: false
                          default: true
                        code:
                          type: integer
                          example: 12005
                          default: 0
                        message:
                          type: string
                          example: Reward constraint evaluation failed. Request failed. Max limit for
                            the DAYS is reached. Allowed limit is 15 For Level CUSTOMER
                    intouch: {}
                    promotion: {}
                    vendor: {}
                - type: object
                  properties:
                    status:
                      type: object
                      properties:
                        success:
                          type: boolean
                          example: false
                          default: true
                        code:
                          type: integer
                          example: 400
                          default: 0
                        message:
                          type: string
                          example: Invalid payment mode passed.,Payment configuration id is mandatory
                - title: '12016'
                  type: object
