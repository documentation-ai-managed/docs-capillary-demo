paths:
  /api_gateway/v1/promotions/customer/109943742:
    get:
      summary: Get Cart Promotions for a Customer
      description: This API is used to retrieve the cart promotions tagged to a particular customer based
        on the user ID. This returns cart promotions issued to the customer or POS promotions which are
        tagged to the customer's tier or supplementary programs.
      operationId: get-promotions-for-a-customer
      parameters:
      - name: includeRedemptions
        in: query
        description: includeRedemptions=true includes the restrictions applied to the promotion including
          max limit and remaining redemptions
        schema:
          type: boolean
      - name: includeSupplementaryPromotions
        in: query
        description: includeSupplementaryPromotions=true includes the POS promotions tagged to the customer's
          tier or supplementary program
        schema:
          type: boolean
      responses:
        '200':
          description: '200'
