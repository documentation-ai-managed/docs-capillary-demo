                                type: string
                                example: billNumber
                              fieldAlias:
                                type: string
                                example: billNumber
                              fieldType:
                                type: string
                                example: DATA
                              dataSourceDetails:
                                type: object
                                properties:
                                  fieldReference:
                                    type: string
