                            lastUpdatedOn:
                              type: string
                              example: '2025-04-01T11:20:09.793+00:00'
                            lastUpdatedBy:
                              type: integer
                              example: 75155282
                              default: 0
                    errors:
                      type: array
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
