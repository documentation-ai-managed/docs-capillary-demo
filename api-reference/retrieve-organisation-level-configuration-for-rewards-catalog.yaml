openapi: 3.1.0
info:
  title: Get Organisation Level Configuration
  version: '1.0'
servers:
- url: https://{host}
  variables:
    host:
      default: host
security:
- sec0: []
paths:
  /api_gateway/rewards/core/v1/brand/{id}/getConfig:
    get:
      summary: Get Organisation Level Configuration
      description: ''
      operationId: retrieve-organisation-level-configuration-for-rewards-catalog
      parameters:
      - name: brandId
        in: path
        description: Unique identifier of the brand.
        schema:
          type: integer
          format: int32
        required: true
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    status:
                      success: true
                      code: 3012
                      message: Org configs fetched successfully
                    configList:
                    - configKeyName: CONF_EXT_POINTS_VENDOR
                      configKeyValue: 'false'
                      brandId: null
                      label: Enable third party vendor for points redemption
                    - configKeyName: CONF_ENABLE_FEATURE_CATALOG_PROMOTION
                      configKeyValue: 'FALSE'
                      brandId: null
                      label: Enable catalog promotion feature for a brand or organization.
                    - configKeyName: CONF_CATALOG_PROMOTION_BUFFER_END_TIME_MINUTES
                      configKeyValue: '5'
                      brandId: null
                      label: Add buffer time in minutes to expiry date of a catalog promotion while issuing
                        a reward.
                    - configKeyName: CONF_START_OF_THE_WEEK_FOR_ORG_RESTRICTION
                      configKeyValue: MONDAY
                      brandId: null
                      label: Add the start of the week for the org level restrictions, this will be applied
                        to all org level restrictions with Week configurations
                    - configKeyName: CONF_SEND_REWARD_EXPIRY_NOTIFICATION_ENABLED
                      configKeyValue: 'true'
                      brandId: null
                      label: Key to enable or disable the expiry notification for rewards. If enabled,
                        the system will send expiry notification for rewards after setting the NUMBER_OF_DAYS_BEFORE_EXPIRY.
                    - configKeyName: CONF_SEND_EXPIRY_NOTIFICATION_FOR_REWARD_TIME
                      configKeyValue: '16:00'
                      brandId: null
                      label: Key to set the time of the day to send the expiry notification for rewards.
              schema:
                type: object
                properties:
                  status:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                        default: true
                      code:
                        type: integer
                        example: 3012
                        default: 0
                      message:
                        type: string
                        example: Org configs fetched successfully
                  configList:
                    type: array
                    items:
                      type: object
                      properties:
                        configKeyName:
                          type: string
                          example: CONF_EXT_POINTS_VENDOR
                        configKeyValue:
                          type: string
                          example: 'false'
                        brandId: {}
                        label:
                          type: string
                          example: Enable third party vendor for points redemption
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: |-
            curl --location 'http://eu.api.capillarytech.com/api_gateway/rewards/core/v1/brand/1/getConfig' \
            --header 'Authorization: Basic Y20uMToyMDJjYjk2MmFjNTkwNzViOTY0YjA3MTUyZDIzNGI3MA=='
        samples-languages:
        - curl
components:
  securitySchemes:
    sec0:
      type: http
      scheme: basic
