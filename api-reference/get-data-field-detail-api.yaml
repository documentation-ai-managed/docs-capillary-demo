                                  type: string
                                  example: firstName
                                fieldAlias:
                                  type: string
                                  example: firstName
                                fieldType:
                                  type: string
                                  example: DATA
                                dataSourceDetails:
                                  type: object
                                  properties:
                                    fieldReference:
                                      type: string
                                      example: firstName
                                dataType:
                                  type: string
                                  example: STRING
