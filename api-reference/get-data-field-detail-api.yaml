          description: '200'
          content:
            application/json:
              examples:
                Customer:
                  value:
                    data:
                    - id: 67e6a8bfdd6a186b5555ba98
                      orgId: 100737
                      searchStrategyType: PREFIX
                      entityType: CUSTOMER
                      dataFieldDefinitions:
                      - fieldId: firstName
                        fieldAlias: firstName
                        fieldType: DATA
                        dataSourceDetails:
                          fieldReference: firstName
                        dataType: STRING
                      - fieldId: lastName
                        fieldAlias: lastName
                        fieldType: DATA
                        dataSourceDetails:
                          fieldReference: lastName
                        dataType: STRING
                      - fieldId: mobile
                        fieldAlias: mobile
                        fieldType: DATA
                        dataSourceDetails:
                          fieldReference: mobile
                        dataType: STRING
                      - fieldId: email
                        fieldAlias: email
                        fieldType: DATA
                        dataSourceDetails:
                          fieldReference: email
                        dataType: STRING
                      - fieldId: externalId
                        fieldAlias: externalId
                        fieldType: DATA
                        dataSourceDetails:
                          fieldReference: externalId
                        dataType: STRING
