                            example: 67e6a8bfdd6a186b5555ba98
                          orgId:
                            type: integer
                            example: 100737
                            default: 0
                          searchStrategyType:
                            type: string
                            example: PREFIX
                          entityType:
                            type: string
                            example: CUSTOMER
                          dataFieldDefinitions:
                            type: array
                            items:
