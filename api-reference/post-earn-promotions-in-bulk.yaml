openapi: 3.1.0
info:
  title: Post Earn Cart Promotions in Bulk
  version: '1.0'
servers:
- url: https://{host}
  variables:
    host:
      default: host
security:
- sec0: []
paths:
  /api_gateway/v1/promotions/earn/bulk:
    post:
      summary: Post Earn Cart Promotions in Bulk
      description: This API is used to earn cart promotions in bulk to the customers
      operationId: post-earn-promotions-in-bulk
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                RAW_BODY:
                  type: string
            examples:
              Request Body:
                value:
                  orgId: 0
                  customerId: 0
                  eventTime: 0
                  earnedFromType: BULK_ISSUE
                  eventDetails:
                    id: string
                    type: string
                    eventPayload:
                      additionalProp1: {}
                      additionalProp2: {}
                      additionalProp3: {}
                  earnedPromotions:
                  - promotionId: string
                    earnCount: 0
                    earnedFromId: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    data:
                    - earnedFromId: string
                      promotionId: string
                      successfulEarnCount: 0
                      failedEarnCount: 0
                      errorDetails:
                        errorCode: 0
                        errorMessages: string
                      customerEarnedPromotions:
                      - id: string
                        customerId: 0
                        promotionId: string
                        eventDetails:
                          earnedFromType: BULK_ISSUE
                          earnedFromId: string
                          eventTime: 0
                          eventDetails:
                            id: string
                            type: string
                            eventPayload:
                              additionalProp1: {}
                              additionalProp2: {}
                              additionalProp3: {}
                          validTill: 0
                          errorDetails:
                            errorCode: 0
                            errorMessages: string
                    errors:
                    - code: 0
                      message: string
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
      deprecated: false
components:
  securitySchemes:
    sec0:
      type: http
      scheme: basic
