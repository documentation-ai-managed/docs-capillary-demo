                          fieldAlias:
                            type: string
                            example: firstName
                          fieldType:
                            type: string
                            example: DATA
                          dataSourceDetails:
                            type: object
                            properties:
                              fieldReference:
                                type: string
                                example: firstName
                          dataType:
                            type: string
                            example: STRING
                - title: Transaction
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 67ebcbe9730aa850fc504145
                        orgId:
                          type: integer
                          example: 100737
                          default: 0
                        searchStrategyType:
                          type: string
                          example: COMBINATION
                        entityType:
                          type: string
                          example: TRANSACTION
                        dataFieldDefinitions:
                          type: array
                          items:
                            type: object
                            properties:
                              fieldId:
                                type: string
                                example: billNumber
                              fieldAlias:
                                type: string
                                example: billNumber
                              fieldType:
                                type: string
                                example: DATA
                              dataSourceDetails:
                                type: object
                                properties:
                                  fieldReference:
                                    type: string
                                    example: billNumber
                              dataType:
                                type: string
                                example: STRING
                        auditInfo:
                          type: object
                          properties:
                            createdOn:
                              type: string
                              example: '2025-04-01T11:20:09.793+00:00'
                            createdBy:
                              type: integer
                              example: 75155282
                              default: 0
                            lastUpdatedOn:
                              type: string
                              example: '2025-04-01T11:20:09.793+00:00'
                            lastUpdatedBy:
                              type: integer
                              example: 75155282
                              default: 0
                    errors:
                      type: array
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
