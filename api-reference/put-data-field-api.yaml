                        createdOn: '2025-04-01T11:20:09.793+00:00'
                        createdBy: 75155282
                        lastUpdatedOn: '2025-04-01T11:20:09.793+00:00'
                        lastUpdatedBy: 75155282
                    errors: []
              schema:
                oneOf:
                - title: Customer
                  type: object
                  properties:
                    searchStrategyType:
                      type: string
                      example: PREFIX
                    entityType:
                      type: string
                      example: CUSTOMER
                    dataFieldDefinitions:
                      type: array
                      items:
                        type: object
                        properties:
                          fieldId:
                            type: string
