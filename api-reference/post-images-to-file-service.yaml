openapi: 3.1.0
info:
  title: Upload images to file service
  version: '1.0'
servers:
- url: https://{host}
  variables:
    host:
      default: host
security:
- sec0: []
paths:
  /api_gateway/file-service/rewards/{fileNameWithExtension}:
    post:
      summary: Upload images to file service
      description: ''
      operationId: post-images-to-file-service
      parameters:
      - name: fileName
        in: path
        description: Name of the image to upload with extension.
        schema:
          type: string
        required: true
      - name: fileNameWithExtension
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    code: 200
                    status: 'true'
                    message: Successfully uploaded file
                    file:
                      name: test.png
                      namespace: rewards
                      version: 2
                      acl: PRIVATE
                      fileSize: '51'
