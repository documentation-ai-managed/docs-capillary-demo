            --header 'Authorization: Basic bmFtYW46Y2FiYvbraf2U5OGM4MWFlNDM5ZTQ1Yjk3ZTM5YTY0NTY0MTY=' \
            --header 'Cookie: _cfuvid=4eFmg.rN4cmzr9LZsrD0ys2FUFL4EdH9c200UfliHiM-1732856907850-0.0.1.1-604800000' \
            --data '{
