openapi: 3.1.0
info:
  title: Get Cart Promotions code API
  version: '1.0'
servers:
- url: https://{host}
  variables:
    host:
      default: host
security:
- sec0: []
paths:
  /api_gateway/v1/promotions/code:
    get:
      summary: Get Cart Promotions code API
      description: This API can be used to fetch the Cart promotion details based on the code of the promotion
      operationId: get-promotions-code-api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                codes:
                  type: string
                  description: Code assigned to the promotion which can be used for redemption
                mode:
                  type: string
                  description: 'type of mode: DISCOUNT or PAYMENT_VOUCHER'
                includeRedemptions:
                  type: boolean
                  description: to include details of redemption
            examples:
              Request Body:
                value:
                  codes:
                  - string
                  mode: DISCOUNT
                  includeRedemptions: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    data:
                    - id: string
                      orgId: 0
                      promotionId: string
                      promotionName: string
                      code: string
                      customerId: 0
                      active: true
                      createdOn: 0
                      validTill: 0
                      mode: DISCOUNT
                      apiError:
                        code: 0
                        message: string
                      redeemableFrom: 0
                      restrictions:
                        additionalProp1:
                        - kpi: REDEMPTION
                          maxLimit: 0
                          remainingRedemption: 0
                          tempRedemption: 0
                          periodStart: 0
                          periodEnd: 0
                        additionalProp2:
                        - kpi: REDEMPTION
                          maxLimit: 0
                          remainingRedemption: 0
                          tempRedemption: 0
                          periodStart: 0
                          periodEnd: 0
                        additionalProp3:
                        - kpi: REDEMPTION
                          maxLimit: 0
                          remainingRedemption: 0
                          tempRedemption: 0
                          periodStart: 0
                          periodEnd: 0
                    errors:
                    - code: 0
                      message: string
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
      deprecated: false
components:
  securitySchemes:
    sec0:
      type: http
      scheme: basic
