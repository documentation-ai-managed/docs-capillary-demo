openapi: 3.1.0
info:
  title: Get Reward Category
  version: '1.0'
servers:
- url: https://{host}
  variables:
    host:
      default: host
security:
- sec0: []
paths:
  /api_gateway/rewards/core/v1/metadata/categories/brand/{brandId}:
    get:
      summary: Get Reward Category
      description: Get reward categories for a particluar brand.
      operationId: get-reward-category
      parameters:
      - name: brandId
        in: path
        description: Unique identifier for the brand.
        schema:
          type: integer
          format: int64
        required: true
      - name: brandName
        in: path
        description: Name of the brand for which you want to retrieve the reward categories.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    status:
                      success: true
                      code: 200
                      message: Category fetched successfully
                    categoryList:
                    - id: 128
                      name: tickets
                      enabled: false
                    - id: 111
                      name: training
                      enabled: true
                Invalid brandId:
                  value:
                    status:
                      success: false
                      code: 3004
                      message: Brand not found
                    categoryList: null
                With sortBy=lastUpdatedOn:
                  value:
                    status:
                      success: true
                      code: 200
                      message: Category fetched successfully
                    categoryList:
                    - id: 170
                      name: toys
                      enabled: true
                      createdOn: 1735816377000
                      lastUpdatedOn: 1735816377000
                      createdBy: null
                      lastUpdatedBy: null
                      createdOnDateTime: '2025-01-02T11:12:57Z'
                      lastUpdatedOnDateTime: '2025-01-02T11:12:57Z'
                    - id: 229
                      name: joreward
                      enabled: true
                      createdOn: 1741059743000
                      lastUpdatedOn: 1741059743000
                      createdBy: null
                      lastUpdatedBy: null
                      createdOnDateTime: '2025-03-04T03:42:23Z'
                      lastUpdatedOnDateTime: '2025-03-04T03:42:23Z'
                    - id: 251
                      name: docdemo
                      enabled: true
                      createdOn: 1742387687000
                      lastUpdatedOn: 1742387687000
                      createdBy: null
                      lastUpdatedBy: null
                      createdOnDateTime: '2025-03-19T12:34:47Z'
                      lastUpdatedOnDateTime: '2025-03-19T12:34:47Z'
              schema:
                oneOf:
                - type: object
                  properties:
                    status:
                      type: object
                      properties:
                        success:
                          type: boolean
                          example: true
                          default: true
                        code:
                          type: integer
                          example: 200
                          default: 0
                        message:
                          type: string
                          example: Category fetched successfully
                    categoryList:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 128
                            default: 0
                          name:
                            type: string
                            example: tickets
                          enabled:
                            type: boolean
                            example: false
                            default: true
                - title: Invalid brandId
                  type: object
                  properties:
                    status:
                      type: object
                      properties:
                        success:
                          type: boolean
                          example: false
                          default: true
                        code:
                          type: integer
                          example: 3004
                          default: 0
                        message:
                          type: string
                          example: Brand not found
                    categoryList: {}
                - title: With sortBy=lastUpdatedOn
                  type: object
                  properties:
                    status:
                      type: object
                      properties:
                        success:
                          type: boolean
                          example: true
                          default: true
                        code:
                          type: integer
                          example: 200
                          default: 0
                        message:
                          type: string
                          example: Category fetched successfully
                    categoryList:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 170
                            default: 0
                          name:
                            type: string
                            example: toys
                          enabled:
                            type: boolean
                            example: true
                            default: true
                          createdOn:
                            type: integer
                            example: 1735816377000
                            default: 0
                          lastUpdatedOn:
                            type: integer
                            example: 1735816377000
                            default: 0
                          createdBy: {}
                          lastUpdatedBy: {}
                          createdOnDateTime:
                            type: string
                            example: '2025-01-02T11:12:57Z'
                          lastUpdatedOnDateTime:
                            type: string
                            example: '2025-01-02T11:12:57Z'
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: |-
            curl --location 'https://eu.api.capillarytech.com/api_gateway/rewards/core/v1/metadata/categories/brand/55' \
            --header 'Accept: */*' \
            --header 'Authorization: Basic Ymxpc3MZTJmNGRjNzU5MWI1NzY='
          name: Sample Request
        - language: curl
          code: |-
            curl --location 'https://eu.api.capillarytech.com/api_gateway/rewards/core/v1/metadata/categories/brand/55?orderBy=ASC&sortBy=lastUpdatedOn' \
            --header 'Accept: */*' \
            --header 'Authorization: Basic Z2VvcmdlLmpvaG5zb246OTg4OTU2NWI4ODVhMmY4ZWE1MTk1MjA2NWEwYTEzNzg=' \
            --header 'Cookie: _cfuvid=fUmBd935rmGsApqf1rYLG1M2QWI_fYSTy7P0wHTVZIs-1747377050702-0.0.1.1-604800000'
          name: With sortBy=lastUpdatedOn
        samples-languages:
        - curl
components:
  securitySchemes:
    sec0:
      type: http
      scheme: basic
